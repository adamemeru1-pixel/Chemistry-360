<style>

*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:72px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,20px);position:sticky;top:0;z-index:10;box-shadow:0 4px 20px #07182722}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.2px;font-size:19px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#25c6bd,#078c91);display:grid;place-items:center;font-size:21px}.brand small{display:block;font-size:9px;letter-spacing:1.7px;color:#9fded9;font-weight:700;margin-top:2px}.nav{display:flex;gap:7px;align-items:center}.nav button{border:0;background:transparent;color:#dbe8f1;padding:10px 13px;border-radius:10px;font-size:13px}.nav button.active,.nav button:hover{background:#ffffff18;color:white}.nav .join{background:var(--teal);color:white;font-weight:750;padding:11px 16px}.menu{display:none;background:transparent;color:white;border:0;font-size:25px}.wrap{max-width:1160px;margin:auto;padding:30px 22px 70px}.hero{background:linear-gradient(120deg,#10253b 0%,#164a61 65%,#087e83 100%);color:white;border-radius:25px;padding:42px;display:grid;grid-template-columns:1.2fr .8fr;gap:20px;overflow:hidden;position:relative;box-shadow:var(--shadow)}.eyebrow{color:#75e2d8;font-size:11px;font-weight:850;letter-spacing:2px}.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-1.8px;margin:14px 0}.hero p{color:#d4e6ec;max-width:530px;line-height:1.7}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:750}.primary{background:var(--teal);color:white}.light{background:white;color:var(--navy)}.outline{background:transparent;border:1px solid #ffffff65;color:white}.hero-art{display:grid;place-items:center;min-height:230px;position:relative}.orb{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#83f0df,#1bacae 42%,#0a596e 75%);box-shadow:0 0 0 22px #ffffff0b,0 0 0 48px #ffffff08;display:grid;place-items:center;font-size:95px;transform:rotate(-10deg)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:20px 0 32px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.stat strong{font-size:23px;color:var(--navy)}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:32px 0 15px}.section-head h2{margin:0;color:var(--navy);font-size:23px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.text-link{color:#078e8b;font-weight:750;border:0;background:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.category{padding:19px;min-height:155px;transition:.2s;cursor:pointer}.category:hover,.lesson:hover{transform:translateY(-3px);border-color:#9adbd5}.cat-icon{width:43px;height:43px;border-radius:13px;background:var(--mint);display:grid;place-items:center;font-size:22px;margin-bottom:14px}.category h3,.lesson h3{margin:0 0 6px;color:var(--navy);font-size:16px}.category p,.lesson p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.lesson-list{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.lesson{display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:.2s}.lesson .cat-icon{flex:none;margin:0}.tag{font-size:10px;font-weight:800;color:#087e7a;background:#e5f7f4;padding:5px 8px;border-radius:99px;display:inline-block;margin-top:10px}.challenge{background:#fff8e9;border:1px solid #f5e5bd;border-radius:18px;padding:22px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:25px}.challenge h3{margin:0 0 6px;color:#725018}.challenge p{margin:0;color:#806c4b;font-size:13px}.challenge .btn{background:#e8ad3f;color:#38260b;white-space:nowrap}.page-title{margin:8px 0 7px;color:var(--navy);font-size:32px}.sub{color:var(--muted);line-height:1.6}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.search{border:1px solid var(--line);border-radius:11px;padding:12px 14px;min-width:230px;background:white}.pill{border:1px solid var(--line);background:white;color:var(--muted);padding:9px 13px;border-radius:99px;font-size:12px}.pill.active{background:var(--navy);color:white}.lesson-body{max-width:780px;margin:20px auto;background:white;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.lesson-body h2{color:var(--navy)}.lesson-body p,.lesson-body li{line-height:1.75;color:#46576a}.callout{background:#eaf8f6;border-left:4px solid var(--teal);padding:15px;border-radius:9px;margin:18px 0;color:#24575a;line-height:1.6}.quiz-option{display:block;width:100%;text-align:left;padding:13px 15px;background:white;border:1px solid var(--line);border-radius:11px;margin:9px 0;color:var(--ink)}.quiz-option.selected{border-color:var(--teal);background:#eaf8f6}.quiz-option.correct{border-color:#28a36a;background:#e9f8ef}.quiz-option.wrong{border-color:#d96b6b;background:#fff0f0}.feedback{padding:12px;border-radius:10px;margin-top:12px;font-size:13px}.feedback.good{background:#e9f8ef;color:#17643e}.feedback.bad{background:#fff2e8;color:#8a4c17}.premium{background:linear-gradient(120deg,#10253b,#1b5364);color:white;border-radius:20px;padding:28px}.premium h2{font-size:27px;margin:8px 0}.premium p{color:#d0e1e8;line-height:1.6}.price{font-size:32px;font-weight:850;margin:14px 0}.feature-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.feature-list span{font-size:13px;color:#e0f3f2}.form{max-width:540px;background:white;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}.form label{display:block;font-size:12px;color:var(--muted);font-weight:750;margin:14px 0 6px}.form input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.notice{background:#fff7e7;color:#76551c;border:1px solid #f0dfb8;padding:13px;border-radius:10px;font-size:12px;line-height:1.6;margin:15px 0}.admin-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:13px 0;font-size:13px}.footer{background:var(--navy);color:#b8cbd7;padding:28px max(5vw,20px);font-size:12px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.footer strong{color:white}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10253b;color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:20;font-size:13px}.hidden{display:none!important}
@media(max-width:760px){.topbar{height:64px}.menu{display:block}.nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--navy);padding:10px 18px 18px;flex-direction:column;align-items:stretch}.nav.open{display:flex}.nav button{text-align:left}.hero{grid-template-columns:1fr;padding:28px 23px}.hero-art{min-height:145px}.orb{width:140px;height:140px;font-size:60px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:19px}.grid{grid-template-columns:repeat(2,1fr)}.lesson-list{grid-template-columns:1fr}.challenge{align-items:flex-start;flex-direction:column}.feature-list{grid-template-columns:1fr}.wrap{padding:22px 15px 50px}}

<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">⚗</div><div>CHEMISTRY 360<small>UNDERSTAND CHEMISTRY. UNDERSTAND LIFE.</small></div></div>

<main class="wrap" id="main"></main>
<footer class="footer"><div><strong>CHEMISTRY 360</strong><br>Understand Chemistry. Understand Life.</div><div>Learning science for everyday life · English edition</div><div>© <span id="year"></span> Chemistry 360</div></footer>

<script>
const lessons=[
{id:1,cat:"Foundations",icon:"⚛️",title:"Atoms: the building blocks of matter",level:"Beginner",time:"6 min",desc:"Discover what everything around you is made of.",body:["All ordinary matter is made of tiny particles called atoms. An atom has a central nucleus containing protons and neutrons, with electrons occupying regions around the nucleus.","The number of protons identifies an element. For example, every carbon atom has six protons. Atoms can join together to form molecules and compounds."],example:"The water you drink is made of H₂O molecules. Each molecule contains two hydrogen atoms joined to one oxygen atom.",question:"Which subatomic particle determines the identity of an element?",options:["Electron","Proton","Neutron"],answer:1,explain:"The number of protons, called the atomic number, identifies an element."},
{id:2,cat:"Everyday Life",icon:"🫧",title:"How soap removes grease",level:"Beginner",time:"5 min",desc:"The chemistry behind washing your hands and clothes.",body:["Grease and oil do not mix well with water. Soap molecules have two different ends: a water-attracting (hydrophilic) end and an oil-attracting (hydrophobic) end.","The oil-attracting ends enter the grease while the water-attracting ends remain in water. With rubbing and rinsing, grease is broken into tiny droplets that can be carried away."],example:"When washing an oily plate, soap helps water remove the grease that water alone would struggle to remove.",question:"Which part of a soap molecule is attracted to water?",options:["Hydrophobic end","Hydrophilic end","Both ends repel water"],answer:1,explain:"The hydrophilic end is attracted to water."},
{id:3,cat:"Environment",icon:"🌧️",title:"Why iron rusts",level:"Beginner",time:"5 min",desc:"Understand corrosion and how to slow it down.",body:["Rusting is the gradual reaction of iron with oxygen in the presence of water. The reddish-brown material formed is hydrated iron(III) oxide.","Salt water often speeds up rusting because dissolved ions help the electrochemical processes involved. Keeping iron dry, painting it, oiling it or galvanising it can reduce contact with water and oxygen."],example:"A bicycle left outside in the rain may develop rust. A protective paint coating helps prevent this.",question:"Which conditions are needed for ordinary rusting of iron?",options:["Oxygen and water","Nitrogen only","Carbon dioxide only"],answer:0,explain:"Iron rusts when it reacts with oxygen in the presence of water."},
{id:4,cat:"Agriculture",icon:"🌱",title:"Why soil pH matters",level:"Beginner",time:"7 min",desc:"Learn how acidity affects plant growth and nutrients.",body:["Soil pH is a measure of how acidic or alkaline soil is. The pH scale commonly ranges from 0 to 14, with pH 7 being neutral at about room temperature.","Soil pH affects how available mineral nutrients are to plant roots. Very acidic or very alkaline soil can make some nutrients less available and may increase the availability of substances that can harm plants."],example:"A farmer can test soil before applying agricultural lime. Lime is used to reduce soil acidity when recommended by a soil test.",question:"What does a soil pH of 7 indicate?",options:["Neutral soil","Strongly acidic soil","Strongly alkaline soil"],answer:0,explain:"A pH of 7 is neutral on the usual pH scale."},
{id:5,cat:"Food & Health",icon:"🍋",title:"Acids in everyday foods",level:"Beginner",time:"5 min",desc:"Explore the acids that give foods their sour taste.",body:["Many foods contain naturally occurring acids. Citrus fruits contain citric acid, while vinegar contains ethanoic (acetic) acid. These acids contribute to sour tastes and can affect food preservation and cooking.","Not every sour substance is safe to taste. Never identify an unknown chemical by tasting it. Laboratory chemicals should only be handled using appropriate safety procedures."],example:"Lemon juice contains citric acid, which contributes to its characteristic sour taste.",question:"Which acid is commonly found in lemon juice?",options:["Hydrochloric acid","Citric acid","Sulphuric acid"],answer:1,explain:"Lemon juice contains citric acid."},
{id:6,cat:"Energy",icon:"🔋",title:"How batteries produce electricity",level:"Beginner",time:"7 min",desc:"A simple introduction to chemical energy and electric current.",body:["A battery contains one or more electrochemical cells. Chemical reactions inside the cell create a potential difference that can drive electric current through an external circuit.","In a rechargeable battery, electrical energy can reverse the chemical changes to a useful extent. Batteries should be collected and recycled through suitable systems rather than thrown carelessly into the environment."],example:"A torch battery supplies energy to the bulb when the circuit is complete.",question:"What type of energy is stored in a battery before it is used?",options:["Chemical energy","Sound energy","Light energy"],answer:0,explain:"A battery stores chemical energy that can be converted into electrical energy."}
];
const categories=[["⚛️","Chemistry Foundations","Atoms, elements, compounds and reactions.","Foundations"],["🏠","Chemistry at Home","Soap, cooking, cleaning and household products.","Everyday Life"],["🌱","Agriculture & Soil","Soil pH, fertilisers and crop productivity.","Agriculture"],["🧪","Practical Chemistry","Experiments, observations and laboratory safety.","Practical"],["🌍","Environment","Pollution, rusting, waste and sustainability.","Environment"],["🔋","Food, Health & Energy","Food acids, batteries and useful chemistry.","Food & Health"]];
let page="home",currentLesson=null,quizIndex=0,quizScore=0,quizAnswers={},filter="All";
const $=s=>document.querySelector(s);
function saved(){try{return JSON.parse(localStorage.getItem("c360_progress")||"{}")}catch(e){return {}}}
function saveProgress(id){let p=saved();p[id]=true;localStorage.setItem("c360_progress",JSON.stringify(p))}
function toast(msg){let t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}
function go(p){page=p;currentLesson=null;document.querySelectorAll(".nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("#nav").classList.remove("open");render()}
function header(title,desc){return `<h1 class="page-title">${title}</h1><p class="sub">${desc}</p>`}
function lessonCard(l){return `<article class="card lesson" onclick="openLesson(${l.id})"><div class="cat-icon">${l.icon}</div><div><h3>${l.title}</h3><p>${l.desc}</p><span class="tag">${l.level} · ${l.time}</span></div></article>`}
function renderHome(){let p=saved();return `<section class="hero"><div><div class="eyebrow">SCIENCE FOR EVERYDAY LIFE</div><h1>Chemistry is<br>everywhere.</h1><p>Discover the science behind the food you eat, the products you use, the environment you live in and the world around you.</p><div class="hero-actions"><button class="btn primary" onclick="go('explore')">Explore lessons →</button><button class="btn outline" onclick="go('quiz')">Try a quick quiz</button></div></div><div class="hero-art"><div class="orb">⚗️</div></div></section>
<div class="stats"><div class="stat"><strong>06</strong><span>Starter lessons</span></div><div class="stat"><strong>${Object.keys(p).length}</strong><span>Lessons completed</span></div><div class="stat"><strong>∞</strong><span>Things to discover</span></div></div>
<div class="section-head"><div><h2>Explore Chemistry</h2><p>Choose a topic that interests you.</p></div><button class="text-link" onclick="go('explore')">View all →</button></div>
<div class="grid">${categories.map(c=>`<article class="card category" onclick="go('explore');setTimeout(()=>chooseFilter('${c[3]}'),30)"><div class="cat-icon">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></article>`).join("")}</div>
<div class="section-head"><div><h2>Start learning</h2><p>Short lessons written in clear, accessible English.</p></div></div><div class="lesson-list">${lessons.slice(0,4).map(lessonCard).join("")}</div>
<div class="challenge"><div><h3>⚡ Daily Chemistry Challenge</h3><p>Why does iron rust faster in a humid environment? Test your understanding with a quick quiz.</p></div><button class="btn" onclick="go('quiz')">Take the challenge</button></div>`}
function renderExplore(){let list=lessons.filter(l=>(filter==="All"||l.cat===filter)&&((!$("#search")||!$("#search").value)||l.title.toLowerCase().includes($("#search").value.toLowerCase())||l.desc.toLowerCase().includes($("#search").value.toLowerCase())));return `${header("Explore the Chemistry library","Learn at your own pace. New learning collections will be added as the platform grows.")}<div class="toolbar"><input class="search" id="search" placeholder="Search lessons..." oninput="updateLessonList()" value=""><button class="pill ${filter==="All"?"active":""}" onclick="chooseFilter('All')">All</button>${["Foundations","Everyday Life","Agriculture","Environment","Food & Health","Energy"].map(c=>`<button class="pill ${filter===c?"active":""}" onclick="chooseFilter('${c}')">${c}</button>`).join("")}</div><div class="lesson-list" id="lessonList">${list.length?list.map(lessonCard).join(""):"<p class='sub'>No lessons match your search yet.</p>"}</div><div class="notice">Learning content is educational. Always follow product labels and laboratory safety guidance. Do not taste or directly handle unknown chemicals.</div>`}
function updateLessonList(){let box=$("#lessonList");if(!box)return;let q=$("#search").value.toLowerCase();let list=lessons.filter(l=>(filter==="All"||l.cat===filter)&&(l.title.toLowerCase().includes(q)||l.desc.toLowerCase().includes(q)));box.innerHTML=list.length?list.map(lessonCard).join(""):"<p class='sub'>No lessons match your search yet.</p>"}
function chooseFilter(c){filter=c;render();let s=$("#search");if(s)s.focus()}
function openLesson(id){currentLesson=lessons.find(l=>l.id===id);page="lesson";render()}
function renderLesson(){let l=currentLesson;if(!l)return renderExplore();let done=saved()[l.id];return `<button class="text-link" onclick="go('explore')">← Back to lessons</button><article class="lesson-body"><span class="tag">${l.cat} · ${l.time}</span><h1 class="page-title">${l.icon} ${l.title}</h1><p class="sub">${l.desc}</p>${l.body.map(x=>`<p>${x}</p>`).join("")}<div class="callout"><strong>Real-life connection</strong><br>${l.example}</div><h2>Check your understanding</h2><p>${l.question}</p><div>${l.options.map((o,i)=>`<button class="quiz-option" onclick="lessonAnswer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div><div id="lessonFeedback"></div><button class="btn primary" style="margin-top:18px" onclick="completeLesson(${l.id})">${done?"Completed ✓":"Mark lesson complete"}</button></article>`}
function lessonAnswer(i){let l=currentLesson;let f=$("#lessonFeedback");f.className="feedback "+(i===l.answer?"good":"bad");f.textContent=(i===l.answer?"Correct! ":"Not quite. ")+l.explain;document.querySelectorAll(".lesson-body .quiz-option").forEach((b,n)=>{b.disabled=true;if(n===l.answer)b.classList.add("correct");else if(n===i)b.classList.add("wrong")})}
function completeLesson(id){saveProgress(id);toast("Lesson progress saved on this device.");render()}
function renderQuiz(){return `${header("Test your Chemistry","Try these quick questions. Your score will appear when you finish.")}<div class="lesson-body"><div class="eyebrow" style="color:#0b9891">STARTER QUIZ · 5 QUESTIONS</div><div id="quizArea"></div></div>`}
const quiz=[
["Which particle has a negative electrical charge?",["Proton","Electron","Neutron"],1,"Electrons carry a negative charge."],
["Which gas is needed for ordinary rusting of iron, together with water?",["Oxygen","Helium","Hydrogen"],0,"Oxygen and water are both needed for ordinary rusting."],
["A solution with pH 3 is best described as:",["Acidic","Neutral","Alkaline"],0,"A pH below 7 is acidic."],
["Which substance is commonly used to reduce acidic soil?",["Sand","Agricultural lime","Cooking oil"],1,"Agricultural lime can neutralise soil acidity when applied appropriately."],
["What is the chemical formula of water?",["CO₂","NaCl","H₂O"],2,"A water molecule contains two hydrogen atoms and one oxygen atom."]
];
function quizStep(){let a=$("#quizArea");if(quizIndex>=quiz.length){a.innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:48px">🏆</div><h2>Quiz complete!</h2><div style="font-size:42px;color:#078e8b;font-weight:850">${quizScore}/${quiz.length}</div><p class="sub">You answered ${quizScore} questions correctly.</p><button class="btn primary" onclick="startQuiz()">Try again</button></div>`;return}let q=quiz[quizIndex];a.innerHTML=`<div style="display:flex;justify-content:space-between;color:#64748b;font-size:12px;margin:20px 0"><span>QUESTION ${quizIndex+1} OF ${quiz.length}</span><span>${Math.round(quizIndex/quiz.length*100)}% complete</span></div><div style="height:6px;background:#e8eef2;border-radius:9px"><div style="height:6px;width:${quizIndex/quiz.length*100}%;background:#16a6a0;border-radius:9px"></div></div><h2>${q[0]}</h2>${q[1].map((o,i)=>`<button class="quiz-option" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}<div id="qFeedback"></div>`}
function answerQuiz(i){let q=quiz[quizIndex],f=$("#qFeedback");let ok=i===q[2];if(ok)quizScore++;document.querySelectorAll("#quizArea .quiz-option").forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add("correct");else if(n===i)b.classList.add("wrong")});f.className="feedback "+(ok?"good":"bad");f.innerHTML=(ok?"Correct! ":"Good try. ")+q[3]+`<br><button class="btn primary" style="margin-top:12px" onclick="quizIndex++;quizStep()">Continue →</button>`}
function startQuiz(){quizIndex=0;quizScore=0;quizStep()}
function renderPremium(){return `${header("Learn more with Premium","Unlock deeper learning resources as Chemistry 360 grows.")}<section class="premium"><div class="eyebrow">CHEMISTRY 360 PREMIUM</div><h2>Take your Chemistry learning further.</h2><p>Get access to expanded learning materials, downloadable guides, additional quizzes and structured short courses.</p><div class="price">UGX 10,000 <span style="font-size:13px;font-weight:500;color:#c8dce5">/ proposed month</span></div><div class="feature-list"><span>✓ Extended lessons and guides</span><span>✓ Additional practice quizzes</span><span>✓ Downloadable resources</span><span>✓ Course completion certificates</span></div><button class="btn primary" onclick="toast('Demo only: payment is not connected yet.')">Preview Premium membership</button></section><div class="notice"><strong>Demo pricing:</strong> This is a proposed launch price for customer testing. No payment will be taken on this prototype. Secure subscriptions and Mobile Money integration must be configured before launch.</div>`}
function renderAbout(){return `${header("About Chemistry 360","Understand Chemistry. Understand Life.")}<div class="lesson-body"><h2>Why Chemistry 360?</h2><p>Chemistry is not only a school subject. It helps explain the food we eat, the materials we use, the medicines we take, the energy that powers our lives and the environment we share.</p><p>Chemistry 360 aims to make scientific knowledge understandable, useful and engaging for everyone.</p><div class="callout"><strong>Our promise</strong><br>Clear explanations, relevant examples, responsible science communication and a growing library of learning resources.</div><h2>Our learning approach</h2><ul><li>Explain scientific ideas in accessible English.</li><li>Connect concepts to familiar situations.</li><li>Encourage curiosity and safe scientific thinking.</li><li>Use quizzes to support understanding.</li></ul><p><strong>Content note:</strong> Educational material is reviewed and expanded as the platform develops. It is not a substitute for professional medical, agricultural, engineering or laboratory advice.</p></div>`}
function renderAdmin(){let p=saved();return `${header("Creator dashboard","A simple local preview of your content and learning activity.")}<div class="grid"><div class="stat"><strong>${lessons.length}</strong><span>Published starter lessons</span></div><div class="stat"><strong>${Object.keys(p).length}</strong><span>Completed lessons on this device</span></div><div class="stat"><strong>0</strong><span>Paid subscribers (demo)</span></div></div><div class="card" style="margin-top:18px"><h2 style="color:#10253b;margin-top:0">Content library</h2>${lessons.map(l=>`<div class="admin-row"><span>${l.icon} ${l.title}</span><span class="tag">Published</span></div>`).join("")}<div class="notice">This is a front-end demonstration dashboard. It does not yet have secure administrator authentication or cloud content management. Do not place private or customer data here.</div></div><div class="card" style="margin-top:15px"><h2 style="color:#10253b;margin-top:0">Next business tasks</h2><div class="admin-row"><span>Connect secure user accounts</span><strong>To do</strong></div><div class="admin-row"><span>Connect Mobile Money payments</span><strong>To do</strong></div><div class="admin-row"><span>Publish reviewed content</span><strong>In progress</strong></div><div class="admin-row"><span>Set up privacy policy and terms</span><strong>To do</strong></div></div>`}
function render(){let main=$("#main");if(page==="home")main.innerHTML=renderHome();else if(page==="explore")main.innerHTML=renderExplore();else if(page==="lesson")main.innerHTML=renderLesson();else if(page==="quiz"){main.innerHTML=renderQuiz();startQuiz()}else if(page==="premium")main.innerHTML=renderPremium();else if(page==="about")main.innerHTML=renderAbout();else if(page==="admin")main.innerHTML=renderAdmin();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".nav button[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
$("#menuBtn").addEventListener("click",()=>$("#nav").classList.toggle("open"));
$("#year").textContent=new Date().getFullYear();
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}))}
render();
</script>

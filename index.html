lor:white}.light{background:white;color:var(--navy)}.outline{background:transparent;color:white;border:1px solid #ffffff70}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.section{margin:28px 0 13px;display:flex;align-items:end;justify-content:space-between;gap:12px}.section h2{margin:0;color:var(--navy);font-size:22px}.section p,.muted{color:var(--muted);font-size:13px;line-height:1.6;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:17px 0 27px}.stat,.card{background:white;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow)}.stat strong{font-size:22px;color:var(--navy);display:block}.stat span{font-size:12px;color:var(--muted)}.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.class-card{border:1px solid var(--line);background:#fff;border-radius:15px;padding:16px;text-align:left;box-shadow:var(--shadow);color:var(--ink)}.class-card:hover,.lesson-card:hover{border-color:#6acbc3;transform:translateY(-2px)}.class-card strong{display:block;font-size:18px;color:var(--navy)}.class-card small{color:var(--muted);line-height:1.5}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.search,.select{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:white;min-width:190px}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:30px;padding:8px 12px;background:#fff;color:var(--muted);font-size:12px}.pill.active{background:var(--navy);color:#fff}.lesson-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.lesson-card{display:flex;gap:13px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:15px;background:#fff;padding:16px;box-shadow:var(--shadow);transition:.15s;color:var(--ink)}.lesson-icon{width:43px;height:43px;flex:none;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-size:22px}.lesson-card strong{display:block;color:var(--navy);margin:1px 0 5px}.lesson-card small{color:var(--muted);line-height:1.5}.tag{display:inline-block;background:#e5f7f4;color:#087d78;border-radius:30px;padding:4px 8px;font-size:10px;font-weight:800;margin-top:8px}.lesson{max-width:850px;margin:0 auto}.back{border:0;background:none;color:#087f83;font-weight:750;padding:8px 0}.lesson h1{font-size:clamp(25px,4vw,36px);color:var(--navy);margin:10px 0}.lesson h2{color:var(--navy);font-size:20px;margin:27px 0 8px}.lesson p,.lesson li{line-height:1.75;color:#425569}.outcome{background:#eff8fb;border-left:4px solid #3186a3;border-radius:8px;padding:14px 17px;margin:16px 0}.callout{background:#eaf8f5;border-left:4px solid var(--teal);border-radius:8px;padding:14px 17px;margin:16px 0;line-height:1.65}.worked{background:#fff8e9;border:1px solid #f1dfb7;border-radius:12px;padding:15px;margin:15px 0;line-height:1.7}.diagram{background:#f7fafc;border:1px solid var(--line);border-radius:14px;padding:12px;margin:15px 0;text-align:center}.diagram svg{width:100%;max-width:560px;height:auto}.video-box{background:#10253b;color:#fff;border-radius:13px;padding:17px;margin:15px 0}.video-box p{color:#d6e5ec;margin:7px 0 12px}.video-box a{color:#8de5db;font-weight:750}.question{border:1px solid var(--line);border-radius:13px;padding:16px;margin:14px 0;background:#fff}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:11px 13px;border-radius:9px;margin:8px 0;color:var(--ink)}.option:disabled{cursor:default}.option.correct{background:#e9f8ef;border-color:#49ae79}.option.wrong{background:#fff0f0;border-color:#d87575}.feedback{font-size:13px;padding:10px;border-radius:8px;margin-top:9px}.good{background:#e9f8ef;color:#17643e}.bad{background:#fff3e8;color:#8a4c17}.notice{background:#fff7e7;border:1px solid #f0dfb8;color:#77561e;border-radius:10px;padding:12px;font-size:12px;line-height:1.6;margin:18px 0}.footer{background:var(--navy);color:#b8cbd7;padding:24px max(4vw,16px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px}.footer strong{color:white}.empty{background:white;padding:25px;border-radius:12px;color:var(--muted)}

<script>
const lessons=[
{id:'s1-particles',level:'S1',topic:'Particle nature of matter',icon:'⚛️',title:'The particle nature of matter',time:'12 min',outcomes:['Describe how particles are arranged and move in solids, liquids and gases.','Use the particle model to explain shape, volume and compressibility.'],intro:'A learner leaves an ice cube on a plate. It melts into water, and after some time the water slowly disappears. The particle model helps explain these changes.',notes:[['Matter is made of particles','The particle model states that all matter is made of tiny particles. These may be atoms, molecules or ions. The particles are in constant motion, although their arrangement and freedom of movement differ in solids, liquids and gases.'],['Solids','Particles are closely packed in an orderly arrangement. They vibrate about fixed positions but do not move freely from place to place. Strong attractions help solids keep a definite shape and volume.'],['Liquids','Particles are close together but are not fixed in position. They move and slide past one another, allowing a liquid to flow and take the shape of its container while keeping a nearly fixed volume.'],['Gases','Particles are far apart and move rapidly in random directions. They spread to fill their container and can be compressed because there are large spaces between particles.']],example:'A gas in a sealed syringe can be compressed by pushing the plunger because the particles have spaces between them. A solid metal block is difficult to compress because its particles are closely packed.',diagram:'states',video:'particle model of solids liquids and gases for secondary school chemistry',quiz:[['Which statement best describes particles in a solid?',['They are far apart and move freely.','They vibrate about fixed positions.','They do not move at all.'],1,'Solid particles vibrate; they are not completely stationary.'],['Why can a gas be compressed easily?',['Its particles can be squeezed closer because they are far apart.','Its particles are larger than liquid particles.','Its particles have no mass.'],0,'There are large spaces between gas particles.']]},
{id:'s2-acids',level:'S2',topic:'Acids and bases',icon:'🧪',title:'Acids, bases and indicators',time:'14 min',outcomes:['Identify common properties of acids and bases.','Explain how indicators distinguish acidic, neutral and alkaline solutions.'],intro:'A farmer tests soil before planting vegetables. The test helps show whether the soil is acidic, neutral or alkaline and whether treatment may be needed.',notes:[['Acids','An acid produces hydrogen ions, H⁺(aq), when dissolved in water. Common examples include hydrochloric acid, sulphuric acid and ethanoic acid. Acidic solutions have pH values below 7 at about room temperature.'],['Bases and alkalis','A base neutralises an acid. An alkali is a base that dissolves in water and produces hydroxide ions, OH⁻(aq). Sodium hydroxide and aqueous ammonia are examples of alkalis. Alkaline solutions have pH values above 7.'],['Indicators','Indicators change colour depending on pH. Universal indicator gives a range of colours: red/orange in acidic solutions, green near neutral and blue/purple in alkaline solutions. Litmus turns red in acid and blue in alkali.'],['Neutralisation','An acid reacts with a base to form a salt and water. For example: hydrochloric acid + sodium hydroxide → sodium chloride + water. The net ionic equation is H⁺(aq) + OH⁻(aq) → H₂O(l).']],example:'Agricultural lime, such as calcium carbonate, can be used to reduce soil acidity. The correct amount should be based on a soil test and local agricultural advice.',diagram:'ph',video:'acids bases indicators pH and neutralisation secondary chemistry',quiz:[['A solution with pH 3 is:', ['Acidic','Neutral','Alkaline'],0,'A pH below 7 is acidic.'],['Which ion is produced by an alkali in water?',['H⁺','OH⁻','Cl⁻'],1,'Alkalis produce hydroxide ions in aqueous solution.']]},
{id:'s3-periodic',level:'S3',topic:'Periodic table',icon:'▦',title:'The periodic table and atomic number',time:'13 min',outcomes:['Define atomic number.','Explain how elements are arranged in the periodic table.'],intro:'A student compares sodium and chlorine. Although both are elements, they have very different properties. Their positions in the periodic table help explain these differences.',notes:[['Atomic number','The atomic number of an element is the number of protons in the nucleus of each atom of that element. It identifies the element. In a neutral atom, the number of electrons equals the number of protons.'],['Arrangement of elements','Elements in the modern periodic table are arranged in order of increasing atomic number. Horizontal rows are called periods and vertical columns are called groups.'],['Groups and periods','Elements in the same group have related chemical properties because they have similar outer-shell electron arrangements. For main-group elements, the period number indicates the number of occupied electron shells.'],['Using the table','For example, sodium has atomic number 11, so a neutral sodium atom has 11 protons and 11 electrons. Its electron arrangement is 2,8,1. Chlorine has atomic number 17 and electron arrangement 2,8,7.']],example:'A neutral atom has 13 electrons. It therefore has 13 protons and atomic number 13. The element is aluminium (Al).',diagram:'atom',video:'atomic number groups periods periodic table chemistry lesson',quiz:[['What determines the identity of an element?',['Number of neutrons','Number of protons','Number of electron shells'],1,'The proton number is the atomic number and identifies the element.'],['A neutral atom has atomic number 8. How many electrons does it have?',['8','16','4'],0,'In a neutral atom, electrons equal protons.']]},
{id:'s4-rates',level:'S4',topic:'Rates of reaction',icon:'⏱️',title:'Factors affecting the rate of reaction',time:'15 min',outcomes:['Define rate of reaction.','Explain how temperature, concentration, surface area and catalysts affect reaction rate.'],intro:'A class investigates magnesium reacting with dilute hydrochloric acid. They notice that changing the acid concentration changes how quickly bubbles of hydrogen gas are produced.',notes:[['Meaning of rate','The rate of a chemical reaction describes how quickly reactants are used up or products are formed. It can be measured by following a change such as gas volume, mass, colour or concentration over time.'],['Collision theory','For a reaction to occur, reacting particles must collide with sufficient energy and with a suitable orientation. The number of successful collisions per unit time affects the reaction rate.'],['Temperature and concentration','Increasing temperature makes particles move faster and increases the proportion of collisions with enough energy to react. Increasing concentration (for solutions) puts more reacting particles in a given volume, increasing collision frequency.'],['Surface area and catalysts','A powdered solid usually reacts faster than the same mass in large lumps because more surface is exposed. A catalyst increases reaction rate by providing an alternative pathway with lower activation energy and is not used up overall.']],example:'If the same mass of calcium carbonate is used, powdered calcium carbonate reacts faster with dilute hydrochloric acid than large marble chips, because the powder has a larger exposed surface area.',diagram:'collision',video:'collision theory factors affecting rate of reaction chemistry',quiz:[['Why does powdered calcium carbonate react faster than large chips?',['It has greater exposed surface area.','It has a lower mass in every case.','It removes the acid.'],0,'More surface is available for collisions with acid particles.'],['What does a catalyst do?',['Raises activation energy','Lowers activation energy through an alternative pathway','Becomes the main product'],1,'A catalyst provides an alternative reaction pathway with lower activation energy.']]},
{id:'s5-equilibrium',level:'S5',topic:'Chemical equilibrium',icon:'⇌',title:'Dynamic chemical equilibrium',time:'16 min',outcomes:['Describe dynamic equilibrium in a closed system.','Explain the effect of changing conditions using Le Chatelier’s principle.'],intro:'In an industrial process, reactants are converted into products. Under suitable conditions, the forward and reverse reactions can occur at equal rates.',notes:[['Reversible reactions','Some reactions can proceed in both forward and reverse directions. They are represented by a double arrow, ⇌. A reversible reaction may reach equilibrium in a closed system.'],['Dynamic equilibrium','At dynamic equilibrium, the forward and reverse reactions continue, but at equal rates. The concentrations of reactants and products remain constant, although they are not necessarily equal.'],['Le Chatelier’s principle','When a system at equilibrium is disturbed by a change in concentration, pressure or temperature, the equilibrium position shifts in the direction that tends to oppose the disturbance.'],['Temperature and catalysts','For an exothermic forward reaction, increasing temperature favours the reverse (endothermic) direction. A catalyst speeds up both forward and reverse reactions equally; it does not change the equilibrium position.']],example:'For N₂(g) + 3H₂(g) ⇌ 2NH₃(g), increasing pressure favours the side with fewer gas molecules, so equilibrium shifts towards ammonia, provided other conditions are unchanged.',diagram:'equilibrium',video:'dynamic chemical equilibrium Le Chatelier principle A level chemistry',quiz:[['At dynamic equilibrium, what is equal?',['Reactant and product concentrations','Forward and reverse reaction rates','Number of atoms on each side only'],1,'The forward and reverse reaction rates are equal.'],['A catalyst at equilibrium:', ['Changes the equilibrium position.','Speeds up both directions without changing equilibrium position.','Stops the reverse reaction.'],1,'A catalyst changes how quickly equilibrium is reached, not its position.']]},
{id:'s6-organic',level:'S6',topic:'Organic chemistry',icon:'🧬',title:'Alkenes and addition reactions',time:'16 min',outcomes:['Recognise the functional group of an alkene.','Describe addition reactions of alkenes.'],intro:'Ethene is an important starting material in the manufacture of polymers and many useful chemicals. Its carbon–carbon double bond makes it more reactive than an alkane.',notes:[['Alkenes','Alkenes are unsaturated hydrocarbons containing at least one carbon–carbon double bond, C=C. For a simple open-chain alkene with one double bond, the general formula is CₙH₂ₙ.'],['Structure and bonding','The double bond consists of one sigma bond and one pi bond. The pi bond is more exposed and can be broken during addition reactions, allowing atoms to add across the double bond.'],['Addition of hydrogen','Hydrogen adds to an alkene in the presence of a suitable metal catalyst, such as nickel, to form an alkane. Ethene + hydrogen → ethane.'],['Test for unsaturation','Bromine water is decolourised by many alkenes as bromine adds across the double bond. This is a common qualitative test for a carbon–carbon double bond; carry it out only with appropriate laboratory safety controls.']],example:'CH₂=CH₂ + H₂ → CH₃–CH₃. Ethene reacts with hydrogen to form ethane in a hydrogenation reaction.',diagram:'alkene',video:'alkenes addition reactions hydrogenation bromine water A level chemistry',quiz:[['What functional group identifies an alkene?',['C–C single bond only','C=C double bond','–OH group'],1,'Alkenes contain a carbon–carbon double bond.'],['What is formed when ethene adds hydrogen?',['Ethane','Ethanol','Ethanoic acid'],0,'Hydrogen adds across the double bond to form ethane.']]}
];
let page='home',selectedClass='All',selectedLesson=null,completed=JSON.parse(localStorage.getItem('c360_library_progress')||'{}');
const $=s=>document.querySelector(s);const main=$('#main');
function saveDone(id){completed[id]=true;localStorage.setItem('c360_library_progress',JSON.stringify(completed));}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#nav').classList.remove('open');render();window.scrollTo(0,0)}
function home(){return `<section class="hero"><div><div class="eyebrow">UGANDAN SECONDARY CHEMISTRY · S1–S6</div><h1>Understand Chemistry.<br>Understand Life.</h1><p>Learn Chemistry through clear notes, real-life examples, diagrams, video resources and interactive questions. Choose your class and learn at your own pace.</p><div class="actions"><button class="btn primary" onclick="go('library')">Explore the learning library →</button><button class="btn outline" onclick="document.getElementById('classes').scrollIntoView({behavior:'smooth'})">Choose your class</button></div></div><div class="hero-art"><div class="orb">⚗️</div></div></section><div class="stats"><div class="stat"><strong>6</strong><span>Class levels: S1–S6</span></div><div class="stat"><strong>${lessons.length}</strong><span>Starter lessons published</span></div><div class="stat"><strong>${Object.keys(completed).length}</strong><span>Lessons completed on this device</span></div></div><div class="section" id="classes"><div><h2>Choose your class</h2><p>Start with the level you are currently studying.</p></div></div><div class="classes">${[['S1','Particle nature of matter','Build your Chemistry foundations.','⚛️'],['S2','Acids and bases','Explore indicators and neutralisation.','🧪'],['S3','Periodic table','Understand atomic number and arrangement.','▦'],['S4','Rates of reaction','Prepare for deeper explanations and exams.','⏱️'],['S5','Chemical equilibrium','Study reversible reactions and equilibrium.','⇌'],['S6','Organic chemistry','Explore alkenes and reaction pathways.','🧬']].map(c=>`<button class="class-card" onclick="openClass('${c[0]}')"><strong>${c[3]} ${c[0]}</strong><small>${c[1]}<br>${c[2]}</small></button>`).join('')}</div><div class="section"><div><h2>Continue learning</h2><p>Open a starter lesson and check your understanding.</p></div><button class="back" onclick="go('library')">View all lessons →</button></div><div class="lesson-grid">${lessons.slice(0,4).map(card).join('')}</div><div class="notice"><strong>Learning note:</strong> This is the first library release, not a complete syllabus. Additional topics and reviewed resources will be added progressively.</div>`}
function card(l){return `<button class="lesson-card" onclick="openLesson('${l.id}')"><span class="lesson-icon">${l.icon}</span><span><strong>${l.level}: ${l.title}</strong><small>${l.topic} · ${l.time}<br>${l.outcomes[0]}</small><span class="tag">${completed[l.id]?'Completed':'Open lesson'}</span></span></button>`}
function openClass(c){selectedClass=c;go('library')}
function library(){let arr=lessons.filter(l=>selectedClass==='All'||l.level===selectedClass);return `<div class="section"><div><h2>Learning library</h2><p>Choose a class, then open a lesson.</p></div></div><div class="toolbar"><input class="search" id="search" placeholder="Search topics or lessons…" oninput="filterLessons()"><div class="pills">${['All','S1','S2','S3','S4','S5','S6'].map(c=>`<button class="pill ${selectedClass===c?'active':''}" onclick="setClass('${c}')">${c}</button>`).join('')}</div></div><div class="lesson-grid" id="lessonGrid">${arr.length?arr.map(card).join(''):'<div class="empty">No lessons have been added for this class yet. More topics are being prepared.</div>'}</div><div class="notice">The lesson collection is a starter library. It is not yet a complete coverage of every topic in the Ugandan S1–S6 Chemistry syllabuses.</div>`}
function setClass(c){selectedClass=c;render()}
function filterLessons(){let q=$('#search').value.toLowerCase();let arr=lessons.filter(l=>(selectedClass==='All'||l.level===selectedClass)&&(l.title.toLowerCase().includes(q)||l.topic.toLowerCase().includes(q)||l.level.toLowerCase().includes(q)));$('#lessonGrid').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">No matching lessons found.</div>'}
function diagram(type){let common='font-family="Arial" font-size="13" fill="#183b55"';if(type==='states')return `<div class="diagram"><strong>Particle model of the three states</strong><svg viewBox="0 0 540 175" role="img" aria-label="Particles close together in solid and liquid, far apart in gas"><g ${common}><text x="80" y="20" text-anchor="middle">SOLID</text><text x="270" y="20" text-anchor="middle">LIQUID</text><text x="455" y="20" text-anchor="middle">GAS</text></g>${[[35,45],[65,45],[95,45],[35,75],[65,75],[95,75],[35,105],[65,105],[95,105],[35,135],[65,135],[95,135]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="#159eaa"/>`).join('')}${[[225,55],[255,48],[285,60],[315,50],[235,85],[270,88],[305,82],[245,118],[280,115],[315,120]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="#159eaa"/>`).join('')}${[[410,55],[470,43],[440,95],[505,120],[395,130],[485,78]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="#159eaa"/>`).join('')}</svg><small class="muted">Schematic illustration; not drawn to scale.</small></div>`;if(type==='ph')return `<div class="diagram"><strong>Approximate pH scale</strong><svg viewBox="0 0 540 100"><defs><linearGradient id="phg"><stop stop-color="#df4545"/><stop offset=".45" stop-color="#f4ce52"/><stop offset=".5" stop-color="#54b77a"/><stop offset="1" stop-color="#6256ba"/></linearGradient></defs><rect x="20" y="20" width="500" height="25" rx="8" fill="url(#phg)"/><g font-size="12" fill="#183b55" text-anchor="middle"><text x="20" y="65">0</text><text x="270" y="65">7 (neutral)</text><text x="520" y="65">14</text><text x="100" y="88">Acidic</text><text x="435" y="88">Alkaline</text></g></svg></div>`;if(type==='atom')return `<div class="diagram"><strong>Simple model of an atom</strong><svg viewBox="0 0 500 210"><ellipse cx="250" cy="105" rx="125" ry="52" fill="none" stroke="#159eaa" stroke-width="2" transform="rotate(-25 250 105)"/><ellipse cx="250" cy="105" rx="125" ry="52" fill="none" stroke="#159eaa" stroke-width="2" transform="rotate(45 250 105)"/><circle cx="250" cy="105" r="25" fill="#f2b84b"/><circle cx="238" cy="98" r="7" fill="#d76a45"/><circle cx="258" cy="111" r="7" fill="#6686c5"/><circle cx="345" cy="65" r="7" fill="#10a6a0"/><g font-size="12" fill="#183b55"><text x="285" y="104">Nucleus</text><text x="358" y="60">Electron</text></g></svg><small class="muted">Simplified model; electron positions are not fixed circular paths.</small></div>`;if(type==='collision')return `<div class="diagram"><strong>Collision theory: more frequent successful collisions</strong><svg viewBox="0 0 500 145"><rect x="15" y="20" width="210" height="100" rx="10" fill="#e7f4f6"/><rect x="275" y="20" width="210" height="100" rx="10" fill="#e7f4f6"/><g fill="#168fa0"><circle cx="50" cy="50" r="8"/><circle cx="100" cy="85" r="8"/><circle cx="175" cy="55" r="8"/><circle cx="320" cy="42" r="8"/><circle cx="360" cy="82" r="8"/><circle cx="400" cy="52" r="8"/><circle cx="450" cy="95" r="8"/><circle cx="300" cy="100" r="8"/><circle cx="430" cy="35" r="8"/></g><g font-size="12" fill="#183b55" text-anchor="middle"><text x="120" y="140">Lower concentration</text><text x="380" y="140">Higher concentration</text></g></svg></div>`;if(type==='equilibrium')return `<div class="diagram"><strong>Dynamic equilibrium</strong><svg viewBox="0 0 500 130"><rect x="25" y="20" width="450" height="85" rx="12" fill="#eaf5f7"/><text x="250" y="57" text-anchor="middle" font-size="22" fill="#183b55">Forward rate = Reverse rate</text><text x="250" y="82" text-anchor="middle" font-size="13" fill="#52697a">Concentrations remain constant in a closed system</text></svg></div>`;return `<div class="diagram"><strong>Ethene: a carbon–carbon double bond</strong><svg viewBox="0 0 500 130"><g stroke="#183b55" stroke-width="3" fill="none"><line x1="180" y1="65" x2="320" y2="65"/><line x1="180" y1="73" x2="320" y2="73"/></g><g fill="#159eaa" font-size="25" font-weight="bold"><text x="140" y="78">C</text><text x="330" y="78">C</text></g><g fill="#183b55" font-size="16"><text x="125" y="35">H</text><text x="125" y="110">H</text><text x="365" y="35">H</text><text x="365" y="110">H</text></g><g stroke="#183b55" stroke-width="2"><line x1="150" y1="42" x2="170" y2="57"/><line x1="150" y1="98" x2="170" y2="83"/><line x1="350" y1="57" x2="365" y2="42"/><line x1="350" y1="83" x2="365" y2="98"/></g></svg><small class="muted">Simplified structural illustration of ethene, C₂H₄.</small></div>`}
function lessonPage(l){let video=`https://www.youtube.com/results?search_query=${encodeURIComponent(l.video)}`;return `<div class="lesson"><button class="back" onclick="go('library')">← Back to library</button><span class="tag">${l.level} · ${l.topic} · ${l.time}</span><h1>${l.icon} ${l.title}</h1><div class="outcome"><strong>By the end of this lesson, you should be able to:</strong><ul>${l.outcomes.map(x=>`<li>${x}</li>`).join('')}</ul></div><h2>Start with this situation</h2><p>${l.intro}</p><h2>Lesson notes</h2>${l.notes.map(n=>`<h3>${n[0]}</h3><p>${n[1]}</p>`).join('')}${diagram(l.diagram)}<div class="worked"><strong>Worked example / application</strong><br>${l.example}</div><div class="video-box"><strong>🎬 Video learning resource</strong><p>Open a YouTube search for supplementary explanations of this topic. Choose a reliable educational video and follow your teacher's syllabus.</p><a href="${video}" target="_blank" rel="noopener">Find a video on this topic ↗</a></div><h2>Check your understanding</h2>${l.quiz.map((q,i)=>`<div class="question"><strong>${i+1}. ${q[0]}</strong><div>${q[1].map((o,j)=>`<button class="option" onclick="checkAnswer(this,'${l.id}',${i},${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="answer-feedback" id="fb-${l.id}-${i}"></div></div>`).join('')}<button class="btn primary" onclick="markComplete('${l.id}')">${completed[l.id]?'Completed ✓':'Mark lesson complete'}</button><div class="notice">Use this lesson as a learning aid alongside your teacher's notes and the official syllabus. Follow laboratory safety rules; never perform chemical experiments without teacher supervision.</div></div>`}
function checkAnswer(btn,id,qi,choice){let l=lessons.find(x=>x.id===id),q=l.quiz[qi],fb=$(`#fb-${id}-${qi}`);if(fb.dataset.done)return;fb.dataset.done='1';let buttons=btn.parentElement.querySelectorAll('button');buttons.forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});fb.className='feedback '+(choice===q[2]?'good':'bad');fb.textContent=(choice===q[2]?'Correct. ':'Not quite. ')+q[3]}
function markComplete(id){saveDone(id);render()}
function about(){return `<div class="lesson"><h1>About Chemistry 360</h1><p>Chemistry 360 is a digital learning project designed to help secondary school learners understand Chemistry through clear explanations, illustrations, real-life applications, video resources and practice questions.</p><div class="callout"><strong>Our learning promise</strong><br>Understand the idea, see how it applies, practise using it and build confidence step by step.</div><h2>Curriculum approach</h2><p>The platform is being developed with Ugandan secondary learners in mind. Each class will be expanded topic by topic and checked against the relevant curriculum and syllabus before being presented as complete.</p><h2>Learning responsibly</h2><p>Video links currently open topic searches rather than a selected or endorsed video. Learners should choose age-appropriate, accurate educational resources and follow their teacher's guidance.</p></div>`}
function render(){main.innerHTML=page==='home'?home():page==='library'?library():page==='lesson'?lessonPage(selectedLesson):about();}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));$('#menuBtn').addEventListener('click',()=>$('#nav').classList.toggle('open'));$('#year').textContent=new Date().getFullYear();function openLesson(id){selectedLesson=lessons.find(l=>l.id===id);page='lesson';render();window.scrollTo(0,0)}render();if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
